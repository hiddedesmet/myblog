              - heading "GitHub's Agentic Engineering System" [level=1] [ref=e84]
            - paragraph [ref=e85]:
              - time [ref=e86]: August 12, 2026
        - generic [ref=e88]:
          - generic [ref=e90]:
            - generic [ref=e91]:
              - paragraph [ref=e94]: Code generation is getting easier, but delivering customer value requires more than just volume. It requires a system.
              - generic [ref=e96]:
                - paragraph [ref=e97]: AI agents can help teams ship faster, but shipping faster does not automatically deliver more value. Without a foundation of strong governance, shared knowledge, and clear feedback loops, agents can increase confusion, rework, and risk.
                - paragraph [ref=e98]: "GitHub's Agentic Engineering System (AES) is a framework for building that foundation, so your teams are set up to deliver customer value from day one. It describes:"
                - list [ref=e99]:
                  - listitem [ref=e100]:
                    - paragraph [ref=e101]: Governance, shared knowledge, and customer value as three "stocks" that shape system health over time
                  - listitem [ref=e102]:
                    - paragraph [ref=e103]: Define, deliver, and detect as three "activities" that move work through the system
                  - listitem [ref=e104]:
                    - paragraph [ref=e105]: Director, performer, and assessor as three "modes" that describe how people and agents contribute
                - paragraph [ref=e106]: "Use this framework to:"
                - list [ref=e107]:
                  - listitem [ref=e108]:
                    - paragraph [ref=e109]: Evaluate your readiness to scale agent use
                  - listitem [ref=e110]:
                    - paragraph [ref=e111]: Decide which work can be delegated, and which needs more human oversight
                  - listitem [ref=e112]:
                    - paragraph [ref=e113]: Improve the quality of information available to people and agents
                - paragraph [ref=e115]: The diagram above shows how work moves through an engineering system with agents (a software component that can work asynchronously and (semi)-autonomously). The three activities form a continuous loop; the three modes describe how people participate; and over time, the three stocks accumulate and shape whether each cycle improves the next.
                - paragraph [ref=e116]: "A simple way to tell whether agent adoption is working: as agent use expands, escaped defect rates should stay flat or fall, and the quality of shared knowledge should improve alongside delivery speed. When both happen, the system is getting faster without getting weaker. If they diverge, something in the operating model needs attention."
                - paragraph [ref=e117]:
                  - text: AES is tool-agnostic. The stocks, activities, and modes apply to any organization adopting agents in software engineering, regardless of vendor. This document uses examples from the GitHub ecosystem because it's the environment we know best, but the same concepts can be mapped to other toolchains. The framework is relevant at both the organizational and team level, though teams are often constrained by the conditions set at the organizational level. Implementation guidance related to this playbook is available in
                  - link "GitHub Well-Architected" [ref=e118] [cursor=pointer]:
                    - /url: https://learn.github.com/well-architected/governance/recommendations/agentic-engineering-system-on-github
                  - text: .
                - paragraph [ref=e119]: "AES also assumes a set of operating-environment conditions: reliable and secure infrastructure, appropriately skilled humans, a culture that supports responsible agent participation, and sufficient data and content access. These are preconditions for the framework to behave as described and are covered under readiness and preconditions in the adoption and readiness FAQ. If they are absent, agent adoption will struggle regardless of how well governance, shared knowledge, and participation modes are designed."
                - paragraph [ref=e120]:
                  - text: AES draws in part on ideas from
                  - link "System Dynamics" [ref=e121] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/System_dynamics
                  - text: and software delivery research, including
                  - link "DORA" [ref=e122] [cursor=pointer]:
                    - /url: https://cloud.google.com/resources/content/dora-roi-of-ai-assisted-software-development
                  - text: . These sources help explain how system conditions shape outcomes over time, and why speed only creates value when it is paired with reliability, learning, and strong operational feedback loops.
                - heading "The stocks that make agent use reliable" [level=2] [ref=e123]
                - heading "How to keep people and agents working effectively at speed" [level=3] [ref=e124]
                - paragraph [ref=e125]: Governance and shared knowledge determine whether agent use is reliable. Customer value tells you whether that reliability is producing results that customers actually value. Together, these three stocks shape whether faster processes lead to better outcomes or just more output and risk.
                - paragraph [ref=e126]: The point is not just to have these stocks, but to keep improving them. In strong systems, each cycle leaves behind better governance, better shared knowledge, and clearer evidence of what customers value.
                - 'heading "Governance: What determines what can be delegated, and what still needs human oversight" [level=3] [ref=e127]'
                - paragraph [ref=e128]: Governance determines what people and agents are allowed to do, under what conditions, and with what oversight. It is what allows low-risk, well-bounded work to move quickly while ensuring higher-risk work gets the human attention it needs. While it may not impact customer value directly, it can make delivery more trustworthy.
                - paragraph [ref=e129]: "When governance is strong, teams can delegate more work with confidence because the boundaries are clear and the controls match the risk. When it's weak, organizations usually end up in one of two bad states: over-restricting agents and losing potential speed gains, or under-restricting them and accumulating avoidable risk."
                - paragraph [ref=e130]: "Good governance is less about creating a single gate and more about maintaining an operating layer that is evaluated continuously as work moves through the system: policy, permissions, reviews, automated checks, security requirements, deployment protections, and escalation paths. When that layer is current and well-calibrated, low-risk work can flow quickly and human attention can stay focused where judgment matters most. When it is vague, stale, or disconnected from real workflows, teams either work around it or are slowed down by it."
                - paragraph [ref=e131]: "Signals:"
                - list [ref=e132]:
                  - listitem [ref=e133]:
                    - paragraph [ref=e134]: Incidents or defects that point to missing controls or weak review boundaries
                  - listitem [ref=e135]:
                    - paragraph [ref=e136]: The share of low-risk work that still queues for manual review
                  - listitem [ref=e137]:
                    - paragraph [ref=e138]: How often automated policy checks pass versus require exceptions
                  - listitem [ref=e139]:
                    - paragraph [ref=e140]: How quickly incidents or near misses lead to governance updates
                  - listitem [ref=e141]:
                    - paragraph [ref=e142]: Whether approved tools and workflows are actually being used
                - 'heading "Shared knowledge: What people and agents need to do good work" [level=3] [ref=e143]'
                - paragraph [ref=e144]: "Shared knowledge is the information people and agents rely on to do good work: code, decisions, documentation, telemetry, and customer feedback. It shapes how well work is defined, delivered, and improved over time. When shared knowledge is current, relevant, and easy to use, both people and agents are more likely to make good decisions and produce useful output."
                - paragraph [ref=e145]: When shared knowledge is strong, work is easier to scope, hand off, and complete with confidence because the right information is available in the right places. When it's weak, people and agents are more likely to rely on guesswork, outdated assumptions, or incomplete context. Humans can sometimes work around those gaps through experience or informal networks, while agents can only act on what they can access, which means weak shared knowledge often turns into fast, confident mistakes.
                - paragraph [ref=e146]: When knowledge is well maintained, decisions are documented, and important information is easy to find, so teams can delegate more effectively and spend less time correcting avoidable errors. When knowledge is stale, scattered, or overloaded with irrelevant detail, work slows down, review burden rises, and mistakes are more likely to add up.
                - paragraph [ref=e147]: "Signals:"
                - list [ref=e148]:
                  - listitem [ref=e149]:
                    - paragraph [ref=e150]: The freshness and quality of documentation, instruction files, and architecture records
                  - listitem [ref=e151]:
                    - paragraph [ref=e152]: How often agent or human work has to be re-scoped because key context was missing
                  - listitem [ref=e153]:
                    - paragraph [ref=e154]: Agent task success rates, especially where low success points to unclear or incomplete inputs
                  - listitem [ref=e155]:
                    - paragraph [ref=e156]: High token use, repeated retries, or tool-call churn on tasks that should be straightforward
                  - listitem [ref=e157]:
                    - paragraph [ref=e158]: How often important decisions or learnings are captured in places the broader system can use
                - heading "What a context window does and doesn't do" [level=3] [ref=e159]
                - paragraph [ref=e160]: An agent's context window is not the same thing as organizational understanding. Even a powerful model can only act on the information it is given or allowed to retrieve, and large volumes of context do not guarantee that the right context is present, current, or well structured. In practice, better outcomes stem from giving agents the right information in a form they can use.
                - 'heading "Customer value: What tells you whether faster delivery is actually paying off" [level=3] [ref=e161]'
                - paragraph [ref=e162]: Customer value is the outcome these other two stocks exist to support. Governance and shared knowledge shape whether work can move quickly and reliably, while customer value tells you whether that work is solving real problems, improving the customer experience, and building trust over time. It is the clearest signal of whether agent adoption is creating better outcomes or just more activity.
                - paragraph [ref=e163]: "When customer value is strong, faster delivery is translating into something customers actually notice: better experiences, more useful capabilities, fewer problems, or stronger trust in the product. When it's weak, teams may still be shipping quickly, but the work is not producing meaningful results. More output without more adoption, satisfaction, or reliability is a sign that something upstream is misaligned."
                - paragraph [ref=e164]: Good customer value depends on the system learning from real signals. Teams need to know not just what they shipped, but whether it worked, who it helped, and what should change next. When delivery is connected to usage, feedback, support patterns, and operational results, teams can correct course earlier and invest more confidently in what matters. When those signals are weak or ignored, it becomes easy to mistake motion for progress.
                - paragraph [ref=e165]: "Signals:"
                - list [ref=e166]:
                  - listitem [ref=e167]:
                    - paragraph [ref=e168]: Feature adoption and usage after release
                  - listitem [ref=e169]:
                    - paragraph [ref=e170]: Customer-reported defects and support volume trends
                  - listitem [ref=e171]:
                    - paragraph [ref=e172]: Satisfaction, retention, or trust indicators tied to delivery cycles
                  - listitem [ref=e173]:
                    - paragraph [ref=e174]: How often shipped work needs rollback or immediate follow-up fixes
                  - listitem [ref=e175]:
                    - paragraph [ref=e176]: Whether teams can clearly connect delivery work to customer outcomes
                - heading "How work moves, and how humans and agents contribute" [level=2] [ref=e177]
                - paragraph [ref=e178]: "The AES framework describes work in two ways. Activities illustrate how work moves through the lifecycle: define, deliver, and detect. Modes describe how people and agents participate in that work as directors, performers, and assessors."
                - paragraph [ref=e179]: These modes are not job titles or team boundaries. They are patterns of work that can shift depending on the situation. The same person or agent may move through multiple modes across the same activity, and the right mix of human and agent involvement depends on risk, governance, and shared knowledge.
                - 'heading "Activities: How work moves" [level=3] [ref=e180]'
                - paragraph [ref=e181]: "The three activities describe the active work of the lifecycle: deciding what should happen, making a change, and observing what happened. They repeat many times across a product's life. What changes from one cycle to the next is not the activity itself, but the surrounding conditions: what governance allows, what shared knowledge is available, and whether a person or an agent is doing the work."
                - 'heading "Define: Decide what should happen" [level=4] [ref=e182]'
                - paragraph [ref=e183]: Define is the decision about what should happen next. It could be writing a requirement, framing an issue, or deciding to act on an alert. In an agentic system, define matters more because cheaper delivery means poorly defined work can move into execution almost immediately.
                - paragraph [ref=e184]: "Strong define depends on shared knowledge: customer insight, prior decisions, system constraints, and clear acceptance criteria. In strong systems, exploratory work is also more likely to turn into production outcomes, because the assumptions, constraints, and success criteria were defined clearly enough to build on. When they are weak, agents can produce well-structured but poorly grounded work very quickly."
                - paragraph [ref=e185]: "Signal: The share of defined work that enters delivery without major re-scoping or rework."
                - 'heading "Deliver: Make the change" [level=4] [ref=e186]'
                - paragraph [ref=e187]: "Deliver is where work changes something in the world: shipping code, creating a prototype, updating documentation, changing infrastructure, or enabling a launch. In an agentic system, the key question is not whether agents can help deliver, but which kinds of delivery can safely move with less human involvement and which still require closer judgment."
                - paragraph [ref=e188]: Low-risk, well-bounded work can often flow through agent performers with strong automated checks and light human review. Higher-risk work, especially work involving trade-offs, customer impact, or difficult-to-reverse consequences, still needs deeper human direction and assessment.
                - paragraph [ref=e189]: "Signal: Whether faster delivery is increasing customer value or just creating more in-flight work and review burden."
                - 'heading "Detect: Observe what happened" [level=4] [ref=e190]'
                - paragraph [ref=e191]: "Detect is how the system observes what happened: telemetry, incidents, support patterns, customer feedback, performance changes, and other real-world signals. Its job is not just to notice those signals, but to turn them into information the next cycle can use."
                - paragraph [ref=e192]: Agents can dramatically increase the volume and speed of detection. The challenge is no longer finding signals, but deciding which ones matter, when to escalate, and how to route them back into shared knowledge and governance. More detection without better interpretation creates noise, not insight.
                - paragraph [ref=e193]: "Signal: Detection latency, signal coverage, and how often detected issues are structured and fed back into future work."
                - 'heading "Modes: How people and agents participate" [level=3] [ref=e194]'
                - paragraph [ref=e195]: "Modes describe how people and agents participate in work. Director sets direction. Performer acts on that direction. Assessor evaluates the result. These aren't fixed roles: the same person or agent may hold different modes at different times depending on capability, risk, and what governance allows."
                - 'heading "Director: Set direction" [level=4] [ref=e196]'
                - paragraph [ref=e197]: Director is the mode that sets intent, scope, and constraints. It decides what outcome matters, what trade-offs are acceptable, and what boundaries the work needs to stay within. In an agentic system, director becomes more important because faster execution makes weak direction more costly.
                - paragraph [ref=e198]: People are often best placed to hold the director mode when the work depends on judgment, organizational context, customer understanding, or competing priorities. Agents can support them by surfacing options, summarizing context, or turning rough goals into clearer plans, but they should not be mistaken for the source of intent.
                - paragraph [ref=e199]: "Anti-patterns:"
                - list [ref=e200]:
                  - listitem [ref=e201]:
                    - paragraph [ref=e202]: Delegating execution without clearly defining the objective
                  - listitem [ref=e203]:
                    - paragraph [ref=e204]: Treating agent-generated plans as if they reflect business intent on their own
                  - listitem [ref=e205]:
                    - paragraph [ref=e206]: Leaving trade-offs or escalation paths implicit
                - 'heading "Performer: Carry out the work" [level=4] [ref=e207]'
                - paragraph [ref=e208]: Performer is the mode that carries out the work. It writes code, updates documentation, runs analysis, opens pull requests, executes remediation steps, or completes other bounded tasks. In an agentic system, agents can often hold this mode well when the task is clear, the context is strong, and the boundaries are well defined.
                - paragraph [ref=e209]: The question is not whether agents can perform work, but which work they can perform reliably. For low-risk, well-scoped tasks, agent performers can increase speed significantly. For work with higher ambiguity, broader consequences, or difficult-to-reverse outcomes, human involvement usually needs to increase alongside automation.
                - paragraph [ref=e210]: "Anti-patterns:"
                - list [ref=e211]:
                  - listitem [ref=e212]:
                    - paragraph [ref=e213]: Using agents on poorly scoped tasks and expecting reliable execution
                  - listitem [ref=e214]:
                    - paragraph [ref=e215]: Expanding delegation without improving governance or shared knowledge
                  - listitem [ref=e216]:
                    - paragraph [ref=e217]: Confusing task completion with successful outcomes
                - 'heading "Assessor: Evaluate the result" [level=4] [ref=e218]'
                - paragraph [ref=e219]: Assessor is the mode that evaluates whether the work is correct, useful, safe, and complete enough to move forward. It reviews outputs against intent, standards, evidence, and real-world results. In an agentic system, assessor becomes more important, not less, because more generated work means more needs to be checked in the right way.
                - paragraph [ref=e220]: People are especially important in this mode when judgment, accountability, or customer impact is involved. Agents can support assessment by running tests, checking policy compliance, flagging anomalies, summarizing diffs, or comparing outputs against known patterns. But strong assessment depends on knowing what evidence matters and when a result should be questioned, not just whether a check passed.
                - paragraph [ref=e221]: "Anti-patterns:"
                - list [ref=e222]:
                  - listitem [ref=e223]:
                    - paragraph [ref=e224]: Treating green checks as a complete substitute for review
                  - listitem [ref=e225]:
                    - paragraph [ref=e226]: Reviewing agent output more lightly than comparable human work
                  - listitem [ref=e227]:
                    - paragraph [ref=e228]: Measuring speed without measuring error, rework, or downstream impact
                - heading "Participation modes grid" [level=3] [ref=e229]
                - paragraph [ref=e230]: In successful organizations, activities and modes work together. Define, deliver, and detect describe the work itself. Director, performer, and assessor describe how people and agents take part in that work. The right mix depends on the task, the context available, and the risk involved.
                - paragraph [ref=e231]: Sometimes people hold all three modes. Sometimes agents take on more of the execution while people stay focused on direction and judgment. The goal is not maximum agent participation. It is the right participation for the work.
                - paragraph [ref=e232]: The matrix below is not a maturity ladder or a fixed operating model. It is a way to think through which forms of participation fit which kinds of work.
                - table [ref=e233]:
                  - rowgroup [ref=e234]:
                    - row [ref=e235]:
