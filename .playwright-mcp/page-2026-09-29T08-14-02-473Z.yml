                        - paragraph
                        - paragraph [ref=e293]: (suited to higher agentic maturity)
                      - cell [ref=e294]:
                        - paragraph [ref=e295]: Agent evaluates a drafted issue against architectural standards, decision records, and dependency risks, then approves with confidence notes or returns it with specific concerns.
                      - cell [ref=e296]:
                        - paragraph [ref=e297]: Agent reviews a pull request by analyzing test results, complexity changes, and security findings, then approves, requests changes, or escalates based on residual risk.
                      - cell [ref=e298]:
                        - paragraph [ref=e299]: Agent examines its detection outputs against historical baselines, identifies where coverage is thin or signal quality has degraded, and recommends targeted improvements.
                - paragraph [ref=e300]: Use activities and modes together to decide where agent participation should expand, where people should stay more involved, and what conditions need to improve first. If a task is poorly defined, high risk, or weakly supported by shared knowledge, increasing automation will usually increase rework and risk. If the task is well bounded, the context is strong, and the assessment path is clear, agent participation can often expand safely.
                - paragraph [ref=e301]: A note on agentic workflows
                - paragraph [ref=e302]:
                  - text: Some teams use
                  - link "orchestrator and worker agent" [ref=e303] [cursor=pointer]:
                    - /url: https://www.anthropic.com/research/building-effective-agents
                  - text: patterns or
                  - link "agentic workflows" [ref=e304] [cursor=pointer]:
                    - /url: https://github.github.com/gh-aw/
                  - text: ", but these do not change the core framework. The same questions still apply: who is directing, who is performing, who is assessing, and what governance and shared knowledge make that participation reliable?"
                - heading "See the framework in action" [level=2] [ref=e305]
                - 'heading "New feature development: private preview to public preview to general availability" [level=3] [ref=e306]'
                - paragraph [ref=e307]: New feature development rarely moves through the lifecycle just once. It usually moves through multiple loops, with each cycle adding to shared knowledge and changing what the team does next.
                - paragraph [ref=e308]: "A team may begin with shared knowledge such as customer insights, product strategy, prior decisions, system constraints, and existing code. That context is used to define an initial version of the work, often a narrow private preview designed to test a specific assumption. The team then delivers that preview to a small group of users and detects what happens: usage, feedback, support needs, defects, and unexpected behavior. Those signals feed back into shared knowledge."
                - paragraph [ref=e309]: The move from private preview to public preview is another loop. The team uses what it learned to define what needs to change before broader exposure, delivers those changes, and detects what happens at larger scale. By the time the feature reaches GA, the system has accumulated more shared knowledge about what users value, where the product struggles, and what needs to be true for a reliable launch.
                - 'heading "Ongoing maintenance and sustainment: signals to stability" [level=3] [ref=e310]'
                - paragraph [ref=e311]: A product in maintenance still moves through the lifecycle, but the cycle often starts with detect rather than a planned feature idea.
                - paragraph [ref=e312]: Signals such as usage patterns, incidents, support tickets, cost changes, and security alerts are continuously produced by the system. Through observability, customer feedback, operational reviews, and agent-supported analysis, those signals are detected and added to shared knowledge. The team uses that updated context to define the next piece of work, which might be a bug fix, reliability improvement, documentation update, or alert change.
                - paragraph [ref=e313]: The team then delivers the change, sometimes with agents doing part of the work under human review, and returns to detect to see whether the change had the intended effect. In this loop, customer value may not look like a new feature. It may show up as lower downtime, fewer support tickets, or more stable performance.
                - 'heading "Security incident: from detection to recovery" [level=3] [ref=e314]'
                - paragraph [ref=e315]: A security incident is another example of the lifecycle starting with detect and moving through the full cycle to restore stability and strengthen the system.
                - paragraph [ref=e316]: "A vulnerability alert, unusual system behavior, or correlated monitoring signal may trigger the cycle. Those signals are detected, investigated, and added to shared knowledge: which systems are affected, what the blast radius is, and which assumptions failed. The team then defines the response, delivers the fix, and returns to detect to confirm that the issue is resolved and that no new problems have appeared."
                - paragraph [ref=e317]: In this kind of loop, agents may help identify affected systems, open pull requests, or summarize evidence, while humans remain closely involved in higher-risk actions such as secret rotation, policy changes, and final approval. The value delivered is not a new feature but the preservation of trust, reliability, and control.
                - heading "Assess where you are and decide what to do next" [level=2] [ref=e318]
                - paragraph [ref=e319]: "This section helps you assess how much work you can safely delegate to agents today, and what you need to strengthen before delegating more. The answer depends on two things: the health of your leading stocks—governance and shared knowledge—and the current range and depth of agent usage across your lifecycle."
                - paragraph [ref=e320]: Below you'll find our Stock-Adoption matrix. It helps teams locate their current posture, understand the risks of expanding too quickly or too slowly, and choose the next move that fits their system. You do not need to move the whole organization at once. Each process or task can shift on its own, so you can adopt one at a time and place each where it fits today.
                - paragraph [ref=e322]: Organizations may move from Underdeveloped foundations to Healthy but underused, and then toward a Healthy agent-native system. But many teams expand agent usage faster than their stocks can support and end up in a Stretched agent-native system instead.
                - paragraph [ref=e323]: To make the four quadrants concrete, the same small task is shown in each one. Only the surrounding conditions change.
                - paragraph [ref=e324]:
                  - text: Shared task. A backend engineer needs to add a
                  - code [ref=e325]: customer_tier
                  - text: field to the
                  - code [ref=e326]: "GET /orders/{id}"
                  - text: "response. The field already exists in the system, so the change is small and read-only: expose the field, update the schema and documentation, and add a test."
                - paragraph [ref=e327]: Healthy agent-native system. Governance and shared knowledge are strong, and agent delegation is appropriately scoped. An agent picks up the task, uses current documentation and contract information, updates the API response, regenerates the spec, and opens a PR. Automated checks confirm the change is additive, and a human reviewer gives final approval. The work merges quickly because the surrounding system is reliable.
                - list [ref=e328]:
                  - listitem [ref=e329]:
                    - paragraph [ref=e330]: "What to do next:"
                    - paragraph
                    - paragraph [ref=e331]: Stay the course and expand to the next safe class of work.
                - paragraph [ref=e332]: Healthy but underused. The foundations are strong, but agent participation is still limited. A human engineer makes the same change using good documentation, reliable tests, and strong review controls. The work is safe and fast, but no agent is involved. The system could support more delegation than it is currently using.
                - list [ref=e333]:
                  - listitem [ref=e334]:
                    - paragraph [ref=e335]: "What to do next:"
                    - paragraph
                    - paragraph [ref=e336]: Expand agent participation in small, well-bounded tasks first.
                - paragraph [ref=e337]: "Underdeveloped foundations. Governance and shared knowledge are too weak to support broader delegation reliably. A human engineer makes the change, but key context is hard to find: the spec is known to drift, downstream consumers are unclear, and the impact must be discovered manually. The engineer eventually finds a dependency that would have broken and coordinates a safer rollout. A human can absorb that discovery cost; an agent likely would not."
                - list [ref=e338]:
                  - listitem [ref=e339]:
                    - paragraph [ref=e340]: "What to do next:"
                    - paragraph
                    - paragraph [ref=e341]: Strengthen shared knowledge and governance before expanding agent use.
                - paragraph [ref=e342]: Stretched agent-native system. Agent usage has expanded faster than governance and shared knowledge. An agent makes the same change using stale or incomplete context. CI passes, a busy reviewer approves, and the PR merges quickly. The hidden dependency is only discovered later when a downstream job fails. The problem is not the agent alone; it is the weak system around it.
                - list [ref=e343]:
                  - listitem [ref=e344]:
                    - paragraph [ref=e345]: "What to do next:"
                    - paragraph
                    - paragraph [ref=e346]: Slow expansion, narrow agent scope, and repair the missing foundations.
                - paragraph [ref=e347]: "The core lesson of the matrix is whether agent usage matches the strength of the foundations beneath it. Healthy agent-native and Underdeveloped foundations are aligned states: in one, strong governance and shared knowledge support broader delegation; in the other, weak foundations limit how much delegation is safe. Healthy but underused and Stretched agent-native are misaligned states: one could safely delegate more, while the other is already delegating too much for its current foundations."
                - paragraph [ref=e348]: Risk appetite affects where an organization draws the line between "healthy enough" and "not yet." Teams with higher tolerance for defect leakage may expand agent usage earlier. Teams with high consequences for failure will require stronger governance and shared knowledge before delegating the same work. The matrix shows direction, not a universal threshold.
                - paragraph
